# Builds the Prosper Command Palette extension on a clean Windows machine: runs the engine checks, then packages a
# signed MSIX for x64 and ARM64, each with a fresh self-signed certificate whose public half (.cer) ships next to it.
#
# On a version tag (git tag v1.1 && git push origin v1.1) the packages, certificates, install script and checksums are
# also attached to that tag's GitHub Release, next to ProsperVoice.exe from release.yml (whichever workflow gets there
# first creates the release; the other adds its files). Otherwise download the "ProsperPalette-<arch>" artifact.
name: Prosper Command Palette extension

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    paths: ["prosper-cmdpal/**", ".github/workflows/cmdpal.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional: attach the build to this existing release tag, e.g. v1.1"
        required: false

permissions:
  contents: read

env:
  # The release tag this run publishes to, if any.
  TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    defaults:
      run:
        working-directory: prosper-cmdpal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Engine checks
        if: matrix.platform == 'x64'
        shell: pwsh
        run: dotnet run --project tests/EngineTests -c Release

      - name: Package version from the tag
        if: env.TAG != ''
        shell: pwsh
        run: |
          # v1.1 -> 1.1.0.0, v1.2.3 -> 1.2.3.0 (MSIX needs four numbers), so a newer release installs as an update.
          $parts = @(($env:TAG.TrimStart('v') -split '[^0-9]+') | Where-Object { $_ -ne '' } | Select-Object -First 3)
          while ($parts.Count -lt 3) { $parts += '0' }
          $version = ($parts + '0') -join '.'
          $manifest = 'ProsperPalette\Package.appxmanifest'
          (Get-Content $manifest -Raw) -replace '(<Identity[^>]*Version=")[^"]+(")', "`${1}$version`${2}" | Set-Content $manifest -Encoding utf8
          Write-Host "Package version $version"

      - name: Signing certificate (self-signed, this build only)
        id: cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=ProsperPalette" `
            -CertStoreLocation Cert:\CurrentUser\My -KeyUsage DigitalSignature -FriendlyName "Prosper Command Palette extension" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") -NotAfter (Get-Date).AddYears(2)
          New-Item -ItemType Directory -Force out | Out-Null
          Export-Certificate -Cert $cert -FilePath out\ProsperPalette-${{ matrix.platform }}.cer | Out-Null
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build and package
        shell: pwsh
        run: |
          $rid = if ("${{ matrix.platform }}" -eq "ARM64") { "win-arm64" } else { "win-x64" }
          msbuild ProsperPalette\ProsperPalette.csproj /restore /m /v:minimal `
            /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:RuntimeIdentifier=$rid /p:SelfContained=true `
            /p:GenerateAppxPackageOnBuild=true /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir="$PWD\AppPackages\\" /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }}
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $msix = Get-ChildItem AppPackages -Recurse -Filter *.msix | Select-Object -First 1
          if (-not $msix) { Write-Error "No .msix was produced"; exit 1 }
          Copy-Item $msix.FullName "out\ProsperPalette-${{ matrix.platform }}.msix"
          Copy-Item install\Install-ProsperPalette.ps1 out\
          Get-ChildItem out | Format-Table Name, Length

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem out -File | Where-Object Name -notlike '*SHA256SUMS*' | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii out\ProsperPalette-${{ matrix.platform }}-SHA256SUMS.txt
          Get-Content out\ProsperPalette-${{ matrix.platform }}-SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ProsperPalette-${{ matrix.platform }}
          path: prosper-cmdpal/out/*
          if-no-files-found: error

  release:
    # Attaches the extension to the tag's GitHub Release (the same one ProsperVoice.exe goes into).
    needs: build
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release if needed and upload its files; nothing else
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to the release
        shell: bash
        run: |
          set -euo pipefail
          ls -l dist
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            # release.yml hasn't created it yet: create it the same way, and release.yml will add the .exe.
            gh release create "$TAG" --verify-tag --title "Prosper Voice ${TAG#v}" \
              --notes-file .github/release-notes.md --generate-notes \
              || echo "release.yml created it meanwhile"
          fi
          gh release upload "$TAG" dist/* --clobber
