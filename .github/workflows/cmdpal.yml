# Builds the Prosper Command Palette extension on a clean Windows machine: runs the engine checks, then packages a
# signed MSIX for x64 and ARM64 with a fresh self-signed certificate whose public half (.cer) ships next to it.
# Download the "ProsperPalette-<arch>" artifact and run Install-ProsperPalette.ps1 (see prosper-cmdpal/README.md).
# Independent of release.yml: the standalone ProsperVoice.exe is built and released exactly as before.
name: Prosper Command Palette extension

on:
  push:
    paths: ["prosper-cmdpal/**", ".github/workflows/cmdpal.yml"]
  pull_request:
    paths: ["prosper-cmdpal/**", ".github/workflows/cmdpal.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    defaults:
      run:
        working-directory: prosper-cmdpal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Engine checks
        if: matrix.platform == 'x64'
        shell: pwsh
        run: dotnet run --project tests/EngineTests -c Release

      - name: Signing certificate (self-signed, this build only)
        id: cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=ProsperPalette" `
            -CertStoreLocation Cert:\CurrentUser\My -KeyUsage DigitalSignature -FriendlyName "Prosper Command Palette extension" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") -NotAfter (Get-Date).AddYears(2)
          New-Item -ItemType Directory -Force out | Out-Null
          Export-Certificate -Cert $cert -FilePath out\ProsperPalette.cer | Out-Null
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build and package
        shell: pwsh
        run: |
          $rid = if ("${{ matrix.platform }}" -eq "ARM64") { "win-arm64" } else { "win-x64" }
          msbuild ProsperPalette\ProsperPalette.csproj /restore /m /v:minimal `
            /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:RuntimeIdentifier=$rid /p:SelfContained=true `
            /p:GenerateAppxPackageOnBuild=true /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir="$PWD\AppPackages\\" /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }}
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $msix = Get-ChildItem AppPackages -Recurse -Filter *.msix | Select-Object -First 1
          if (-not $msix) { Write-Error "No .msix was produced"; exit 1 }
          Copy-Item $msix.FullName "out\ProsperPalette-${{ matrix.platform }}.msix"
          Copy-Item install\Install-ProsperPalette.ps1 out\
          Get-ChildItem out | Format-Table Name, Length

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem out -File | Where-Object Name -ne SHA256SUMS.txt | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii out\SHA256SUMS.txt
          Get-Content out\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ProsperPalette-${{ matrix.platform }}
          path: prosper-cmdpal/out/*
          if-no-files-found: error
